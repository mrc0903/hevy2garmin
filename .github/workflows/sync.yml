name: Sync Hevy to Garmin

on:
  schedule:
    - cron: '0 */2 * * *' # Executa a cada 2 horas
  workflow_dispatch: # Permite disparar o botão manual

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install hevy2garmin
        run: |
          python -m pip install --upgrade pip
          pip install hevy2garmin

      - name: Run Sync
        env:
          HEVY_API_KEY: ${{ secrets.HEVY_API_KEY }}
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_TOKEN: ${{ secrets.GARMIN_TOKEN }}
        run: |
          mkdir -p ~/.garminconnect
          # Grava o token do secret para a pasta da biblioteca
          echo "$GARMIN_TOKEN" > ~/.garminconnect/oauth2_token.json
          hevy2garmin sync
